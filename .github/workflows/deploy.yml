name: Deploy Hub to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-hub-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Start SSH agent and add deploy key
        shell: bash
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          eval "$(ssh-agent -s)"
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" | tr -d '\r' | ssh-add -
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /var/www/hub

            git fetch origin
            git reset --hard origin/main

            composer install --no-dev --optimize-autoloader --no-interaction
            npm ci
            npm run build

            sudo chown -R www-data:www-data /var/www/hub/storage /var/www/hub/bootstrap/cache
            sudo chmod -R 775 /var/www/hub/storage /var/www/hub/bootstrap/cache
            sudo find /var/www/hub/storage -type f -exec chmod 664 {} \;
            sudo find /var/www/hub/bootstrap/cache -type f -exec chmod 664 {} \;

            sudo -u www-data php artisan config:clear
            sudo -u www-data php artisan cache:clear || true
            sudo -u www-data php artisan config:cache
            sudo -u www-data php artisan route:cache
            sudo -u www-data php artisan view:cache
            sudo -u www-data php artisan migrate --force
            sudo -u www-data php artisan optimize

            sudo systemctl restart php8.4-fpm
            sudo systemctl restart hub-queue
            sudo systemctl reload nginx

            sudo -u www-data php artisan up
